{% extends "layouts/settings.html" %}

{% block title %}{{ title }} · Settings · Downbeat{% endblock %}

{% block settings %}
<p><a href="{% url back %}">← Back</a></p>
<h1>{{ title }}</h1>
<form method="post" class="flow">
  {% csrf_token %}
  {{ form }}
  <button class="button" type="submit" data-variant="primary">Save</button>
</form>
{% if delete_url %}
<form method="post" action="{% url delete_url object.pk %}" onsubmit="return confirm('Delete {{ object|escapejs }}?')">
  {% csrf_token %}
  <button class="button" type="submit" data-variant="danger">Delete</button>
</form>
{% endif %}
{% endblock %}
